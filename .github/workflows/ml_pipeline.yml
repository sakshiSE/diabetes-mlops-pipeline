name: Diabetes MLOps Pipeline

"on":
  push:
    branches:
      - main

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model and evaluate quality gate
        run: |
          python src/train.py

      - name: Run application tests
        run: |
          python -m pytest tests/test_prediction.py -v

      - name: Create model package
        run: |
          mkdir model-package
          cp model/diabetes_model.joblib model-package/
          cp model/metrics.json model-package/
          cp src/predict.py model-package/
          cp requirements.txt model-package/

      - name: Upload model package
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-model-package-${{ github.run_number }}
          path: model-package/